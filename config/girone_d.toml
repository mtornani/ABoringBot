# Serie D 2026-27, girone D. Committed config: no discretionary choices beyond the method.
[competition]
name = "Serie D girone D"
season = 2026
tm_code = "IT4D"
tm_slug = "serie-d-girone-d"
sofascore_unique_tournament = 1380
sofascore_season_year = "26/27"
n_teams = 18

[method]
min_birth_year = 2003
# conflict rule, metodo.md sec. 1 (fixed in advance)
max_gap_goals_assists = 1
max_gap_minutes = 30

[fetch]
tm_delay_s = 3.0
sofascore_delay_s = 2.0

# Transfermarkt position (Italian, main position) -> role group (metodo.md, Changelog sec. 1)
[roles]
"Difensore centrale" = "CB"
"Terzino sinistro" = "FB"
"Terzino destro" = "FB"
"Esterno di sinistra" = "FB"
"Esterno di destra" = "FB"
"Mediano" = "MID"
"Centrocampista" = "MID"
"Centrocampo" = "MID"
"Trequartista" = "MID"
"Ala sinistra" = "ATT"
"Ala destra" = "ATT"
"Seconda punta" = "ATT"
"Punta centrale" = "ATT"
"Attacco" = "ATT"
"Difesa" = "CB"
"Portiere" = "GK"

